name: Test and deploy SizeMate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests --basetemp=.test-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-ui-screenshots
          path: .test-artifacts/**/*.png
  deploy:
    name: Deploy production to Vercel
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: sizemate-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo 'Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to repository Actions secrets.'
            exit 1
          fi
      - run: npm install --global vercel@65.4.0
      - name: Deploy tested commit
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Check public application
        run: |
          curl --fail --retry 3 https://sizemate-web.vercel.app/health
          curl --fail --retry 3 https://sizemate-web.vercel.app/api/limits
