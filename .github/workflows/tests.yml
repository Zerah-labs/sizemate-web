name: Conversion and responsive UI tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests --basetemp=.test-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-ui-screenshots
          path: .test-artifacts/**/*.png
